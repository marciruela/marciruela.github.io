<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" role="img">
  <title>Mar Ciruela — Logo principal</title>
  <desc>Monograma MC con esquinas ornamentales doradas</desc>
  <rect width="140" height="140" fill="#0a0a0a"/>
  <!-- Esquinas -->
  <line x1="16" y1="16" x2="42" y2="16" stroke="#c8a96e" stroke-width="1.8"/>
  <line x1="16" y1="16" x2="16" y2="42" stroke="#c8a96e" stroke-width="1.8"/>
  <line x1="124" y1="16" x2="98" y2="16" stroke="#c8a96e" stroke-width="1.8"/>
  <line x1="124" y1="16" x2="124" y2="42" stroke="#c8a96e" stroke-width="1.8"/>
  <line x1="16" y1="124" x2="42" y2="124" stroke="#c8a96e" stroke-width="1.8"/>
  <line x1="16" y1="124" x2="16" y2="98" stroke="#c8a96e" stroke-width="1.8"/>
  <line x1="124" y1="124" x2="98" y2="124" stroke="#c8a96e" stroke-width="1.8"/>
  <line x1="124" y1="124" x2="124" y2="98" stroke="#c8a96e" stroke-width="1.8"/>
  <!-- Puntos en esquinas -->
  <circle cx="16" cy="16" r="1.5" fill="#c8a96e"/>
  <circle cx="124" cy="16" r="1.5" fill="#c8a96e"/>
  <circle cx="16" cy="124" r="1.5" fill="#c8a96e"/>
  <circle cx="124" cy="124" r="1.5" fill="#c8a96e"/>
  <!-- MC centrado y bajado, más pequeño para no tocar el enmarcado -->
  <text x="70" y="88" font-family="Cormorant Garamond, Georgia, serif" font-size="54" font-weight="300" font-style="italic" fill="#c8a96e" text-anchor="middle" letter-spacing="-4">MC</text>
</svg>
