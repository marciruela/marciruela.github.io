<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmony Finder</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="background-gradient"></div>
  
  <header>
    <div class="header-content">
      <h1><i class="fas fa-music"></i> TrackWave</h1>
      <p class="subtitle">Descubre la música que amas</p>
    </div>
  </header>

  <main>
    <div class="search-container">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Busca artistas, canciones o álbumes..." />
        <button id="search-button">
          <i class="fas fa-search"></i>
          <span>Buscar</span>
        </button>
      </div>
    </div>

    <div class="content-wrapper">
      <div class="results"></div>
      <div class="sidebar">
        <div class="history-sidebar"></div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
  <footer class="site-footer">
  <div class="footer-content">
    <p><i class="far fa-copyright"></i> 2025 TrackWave - Todos los derechos reservados</p>
  </div>
</footer>
</body>
</html>
